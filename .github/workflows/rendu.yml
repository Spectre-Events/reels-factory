name: Rendu des reels

# Se déclenche quand un script arrive dans content/ (ou quand voices/essais.txt change).
# Produit la vidéo avec la voix Chatterbox et la dépose sur la branche « media ».
on:
  push:
    branches: [main]
    paths:
      - 'content/*.json'
      - 'voices/essais.txt'
  workflow_dispatch:
    inputs:
      script:
        description: 'Script à rendre (content/xxx.json). Vide : essais de voix seulement.'
        required: false

permissions:
  contents: write

concurrency:
  group: rendu
  cancel-in-progress: false

jobs:
  rendu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REEL_VOICE_ENGINE: chatterbox
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Quoi rendre
        id: quoi
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scripts="${{ inputs.script }}"
            essais=$([ -z "$scripts" ] && echo oui || echo non)
          else
            changed=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD 2>/dev/null || git ls-files 'content/*.json' 'voices/essais.txt')
            scripts=$(echo "$changed" | grep -E '^content/.*\.json$' | tr '\n' ' ' || true)
            essais=$(echo "$changed" | grep -q '^voices/essais.txt$' && echo oui || echo non)
          fi
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"
          echo "essais=$essais" >> "$GITHUB_OUTPUT"
          echo "À rendre : ${scripts:-rien} | essais de voix : $essais"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-rendu.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Cache du modèle de voix
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voix-chatterbox-v3

      - name: Dépendances
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements-rendu.txt --extra-index-url https://download.pytorch.org/whl/cpu
          npm ci --silent
          python -m playwright install --with-deps chromium > /dev/null
          python -c "import torch, chatterbox; print('torch', torch.__version__, '| coeurs', torch.get_num_threads())"

      - name: Essais de voix
        if: steps.quoi.outputs.essais == 'oui'
        run: python engine/voice_lab.py

      - name: Rendu
        if: steps.quoi.outputs.scripts != ''
        run: |
          for s in ${{ steps.quoi.outputs.scripts }}; do
            echo "::group::$s"
            python engine/build.py "$s" || echo "::error::Échec du rendu de $s"
            echo "::endgroup::"
          done

      - name: Publication sur la branche media
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash engine/publish_media.sh
